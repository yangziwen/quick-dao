# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Report coverage to Coveralls
      # 仅 push 到 master 时上报：fork 的 PR 无法读取 secrets，避免上报步骤失败
      if: github.event_name == 'push'
      run: mvn -B coveralls:report --file pom.xml
    - name: Report coverage to Codacy
      # 复用 quick-dao-coverage 聚合出的 jacoco 报告（与 coveralls 上报同一份）
      # token 存放于仓库 secret：Settings -> Secrets and variables -> Actions -> CODACY_PROJECT_TOKEN
      if: github.event_name == 'push'
      uses: codacy/codacy-coverage-reporter-action@v1
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: quick-dao-coverage/target/site/jacoco-aggregate/jacoco.xml
    - name: Upload surefire reports
      # 构建失败时也要上传，便于排查（如 ES 单测为何失败）
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: '**/target/surefire-reports/*.xml'
        if-no-files-found: ignore
    - name: Upload jacoco coverage report (HTML)
      # 覆盖率详情 HTML：下载解压后打开 index.html，
      # 可按包/类逐行查看覆盖情况（绿色已覆盖、黄色分支部分覆盖、红色未覆盖）
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: quick-dao-coverage/target/site/jacoco-aggregate/
        if-no-files-found: ignore
